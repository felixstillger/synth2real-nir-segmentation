# Cross-Domain Evaluation Configuration - DeepLabv3+ (NIR-only, 8-class, Ranus target)
# Generated for colleague's evaluation runs
# All models: GTA5 NIR 8-class + Ranus NIR 8-class, with 3 seeds each
evaluation:
  output_dir: work_dirs/cross_domain_eval_ranus_8class_deeplabv3plus_rgb_30k
  save_visualizations: true
  visualization_interval: 50
  save_confusion_matrix: true
  cm_color_theme: winter
  num_workers: 4
  batch_size: 1
checkpoint:
  strategy: best
test_datasets:
  ranus_nir_8class:
    name: Ranus NIR (8-class Filtered)
    dataset_type: Ranus8ClassDataset
    data_root: data/Ranus_prepared
    test_img_path: filtered_t10_agree80/NIR/test
    test_seg_path: GT_8class/test
    domain: real
    modality: nir
    class_set: ranus_8class
  ranus_rgb_8class:
    name: Ranus RGB (8-class Filtered)
    dataset_type: Ranus8ClassDataset
    data_root: data/Ranus_prepared
    test_img_path: filtered_t10_agree80/RGB/test
    test_seg_path: GT_8class/test
    domain: real
    modality: rgb
    class_set: ranus_8class
models:
  gta5_nir_8class_deeplabv3plus:
    name: DeepLabv3+ GTA5 NIR (seed 0)
    config: configs/deeplabv3plus/deeplabv3plus_r50-d8_4xb2-60k_gta5_8class_nir.py
    work_dir: work_dirs/trainings/gta5/deeplabv3plus_r50-d8_4xb2-60k_gta5_8class_nir
    train_dataset: gta5_nir_8class
    architecture: deeplabv3plus
    backbone: resnet50
    class_set: ranus_8class
  gta5_nir_8class_deeplabv3plus_v1:

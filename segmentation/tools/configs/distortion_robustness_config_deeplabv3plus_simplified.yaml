# Distortion Robustness Evaluation Configuration - DeepLabv3+ (NIR-only, Ranus-only, 8-class)

evaluation:
  output_dir: "work_dirs/distortion_robustness_deeplabv3plus"
  splits: ["test"]
  match_modality: false

# Regex patterns for parsing distortion directory names
distortion_patterns:
  elastic_transform: ".*_elastic_transform_alpha(?P<intensity>[\\d.]+)"
  swirl_transform: ".*_swirl_transform_strength(?P<intensity>[\\d.]+)_radius[\\d.]+"
  low_pass_filter: ".*_low_pass_filter_std(?P<intensity>\\d+)"
  uniform_noise: ".*_uniform_noise_contrast[\\d.]+_uniform_noise(?P<intensity>[\\d.]+)"

# Distortion type classification
distortion_types:
  geometric:
    - elastic_transform
    - swirl_transform
  photometric:
    - uniform_noise
    - low_pass_filter
    - high_pass_filter
    - phase_scrambling
    - contrast
    - salt_and_pepper_noise

# Distorted test datasets - RANUS NIR only
test_datasets:
  # ranus_rgb_distorted:
  #   name: "Ranus RGB Distorted"
  #   dataset_type: "Ranus8ClassDataset"
  #   data_root: "data/Ranus_prepared"
  #   distortion_root: "data/Ranus_prepared/RGB_distorted"
  #   gt_seg_path: "GT_8class"
  #   distorted_gt_root: "GT_8class_distorted"
  #   modality: "rgb"
  #   class_set: "ranus_8class"

  ranus_nir_distorted:
    name: "Ranus NIR Distorted"
    dataset_type: "Ranus8ClassDataset"
    data_root: "data/Ranus_prepared"
    distortion_root: "data/Ranus_prepared/NIR_distorted"
    gt_seg_path: "GT_8class"
    distorted_gt_root: "GT_8class_distorted"

  #   gt_seg_path: "GT_8class"
  #   distorted_gt_root: "GT_8class_distorted"
  #   modality: "rgb"
  #   class_set: "ranus_8class"

  ranus_nir_distorted:
    name: "Ranus NIR Distorted"
    dataset_type: "Ranus8ClassDataset"
    data_root: "data/Ranus_prepared"
    distortion_root: "data/Ranus_prepared/NIR_distorted"
    gt_seg_path: "GT_8class"
    distorted_gt_root: "GT_8class_distorted"
    modality: "nir"
    class_set: "ranus_8class"


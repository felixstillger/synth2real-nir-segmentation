# Cross-Domain Evaluation Configuration - Mask2Former (NIR-only, 8-class, Ranus target)
# Generated for colleague's evaluation runs
# All models: GTA5 NIR 8-class + Ranus NIR 8-class, with 3 seeds each
evaluation:
  output_dir: /home/hamscher/projects/NIR/eval_results_felix/cross_domain_eval_ranus_8class_mask2former_gta5_rgb_30k
  save_visualizations: true
  visualization_interval: 50
  save_confusion_matrix: true
  cm_color_theme: winter
  num_workers: 2
  batch_size: 1
test_datasets:
  ranus_nir_8class:
    name: Ranus NIR (8-class Filtered)

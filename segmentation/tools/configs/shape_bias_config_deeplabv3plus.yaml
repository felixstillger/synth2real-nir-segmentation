# Shape & Texture Bias Evaluation Configuration - DeepLabv3+ (NIR-only, 8-class)
# Evaluates shape bias using EED (edge-enhanced) vs Voronoi-64/128 (texture-shuffled)
# Ranus-only evaluation (no GTA5 benchmarks)
# All models with 3 seeds for statistical significance
evaluation:
  splits:
  - test
benchmark_datasets:
  ranus_nir_eed:
    name: Ranus NIR EED 5792 (Shape)
    dataset_type: Ranus8ClassDataset
    data_root: data/Ranus_prepared
    img_path: NIR_EED/5792/test
    seg_path: GT_8class/test
    class_set: ranus_8class
    modality: nir
    benchmark_type: shape
  ranus_nir_voronoi64:
    name: Ranus NIR Voronoi-64 (Texture)
    dataset_type: Ranus8ClassDataset
    data_root: data/Ranus_prepared
    img_path: Voronoi_shuffled_64/NIR/test
    seg_path: Voronoi_shuffled_64/GT_8class/test
    class_set: ranus_8class
    modality: nir
    benchmark_type: texture
  ranus_nir_voronoi128:
    name: Ranus NIR Voronoi-128 (Texture)
    dataset_type: Ranus8ClassDataset
    data_root: data/Ranus_prepared
    img_path: Voronoi_shuffled_128/NIR/test
    seg_path: Voronoi_shuffled_128/GT_8class/test
    class_set: ranus_8class
    modality: nir
    benchmark_type: texture
benchmark_pairs:
- name: shape_bias_64
  shape_dataset: eed
  texture_dataset: voronoi64
- name: shape_bias_128
  shape_dataset: eed
  texture_dataset: voronoi128
models:
  gta5_nir_deeplabv3plus:
    name: DeepLabv3+ GTA5 NIR (seed 0)
    config: configs/deeplabv3plus/deeplabv3plus_r50-d8_4xb2-60k_gta5_8class_nir.py
    work_dir: work_dirs/trainings/gta5/deeplabv3plus_r50-d8_4xb2-60k_gta5_8class_nir

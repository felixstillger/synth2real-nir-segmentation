# Distortion Robustness Evaluation Configuration - Mask2Former (NIR-only, Ranus-only, 8-class)
# Simplified version: Only RANUS NIR distorted dataset, all NIR models from shape_bias config
# NOTE: Mask2Former uses 60k iterations

evaluation:
  output_dir: "/home/hamscher/projects/NIR/eval_results_felix/distortion_robustness_mask2former"
  splits: ["test"]
  match_modality: false

# Regex patterns for parsing distortion directory names
distortion_patterns:
  elastic_transform: ".*_elastic_transform_alpha(?P<intensity>[\\d.]+)"
  swirl_transform: ".*_swirl_transform_strength(?P<intensity>[\\d.]+)_radius[\\d.]+"
  low_pass_filter: ".*_low_pass_filter_std(?P<intensity>\\d+)"
  uniform_noise: ".*_uniform_noise_contrast[\\d.]+_uniform_noise(?P<intensity>[\\d.]+)"

# Distortion type classification
distortion_types:
  geometric:
    - elastic_transform
    - swirl_transform
  photometric:
    - uniform_noise
    - low_pass_filter
    - high_pass_filter
    - phase_scrambling
    - contrast
    - salt_and_pepper_noise

# Class set mappings for cross-domain evaluation
class_mappings:
  cityscapes_19_to_ranus_8class:
    pred_mapping: "cityscapes_to_ranus_8class"
    gt_mapping: "none"
  cityscapes_16_to_ranus_8class:
    pred_mapping: "cityscapes_16_to_ranus_8class"
    gt_mapping: "none"

# Distorted test datasets - RANUS NIR only
